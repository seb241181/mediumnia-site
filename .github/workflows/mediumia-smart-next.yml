name: MediumIA one-shot next availability patch

on:
  push:
    branches:
      - agent/mediumia-platform-public
    paths:
      - .github/workflows/mediumia-smart-next.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/mediumia-platform-public
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply focused booking UX patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path}')
              p.write_text(text.replace(old, new, 1))

          # 1) Availability endpoint: never advertise a slot that rdv-book will reject
          # because of min_advance_hours.
          replace_once(
              'api/rdv-availability.js',
              ".select('id, timezone, is_active, booking_enabled, buffer_before_min, buffer_after_min, max_per_day')",
              ".select('id, timezone, is_active, booking_enabled, min_advance_hours, buffer_before_min, buffer_after_min, max_per_day')",
          )

          replace_once(
              'api/rdv-availability.js',
              "  const slots = generateSlots(date, rules, googleBusy, existingBusy, offsetMs, durationMin, bufBeforeMs, bufAfterMs)\n\n  return res.status(200).json({ mode: 'live', slots, notice: null })",
              "  const minAdvanceMs = (practitioner.min_advance_hours ?? 0) * 3600_000\n  const earliestBookableAt = Date.now() + minAdvanceMs\n\n  const slots = generateSlots(date, rules, googleBusy, existingBusy, offsetMs, durationMin, bufBeforeMs, bufAfterMs)\n    .map(slot => {\n      const slotStart = parisTimeToUTC(date, slot.time, offsetMs).getTime()\n      return { ...slot, available: slot.available && slotStart >= earliestBookableAt }\n    })\n\n  return res.status(200).json({ mode: 'live', slots, notice: null })",
          )

          # 2) Public booking UI: after an instant service is selected, search the
          # first real available day (Google + MediumIA + min advance) and jump there.
          replace_once(
              'src/components/rdv/RdvPublic.jsx',
              "import { useState, useEffect } from 'react'",
              "import { useState, useEffect, useRef } from 'react'",
          )

          replace_once(
              'src/components/rdv/RdvPublic.jsx',
              "  const [bookingError, setBookingError]     = useState(null)\n",
              "  const [bookingError, setBookingError]     = useState(null)\n  const [findingNext, setFindingNext]       = useState(false)\n  const [nextSearchError, setNextSearchError] = useState(null)\n  const [autoSuggested, setAutoSuggested]   = useState(false)\n  const nextSearchSeq = useRef(0)\n",
          )

          old_flow = '''  function selectService(svc) {
    setService(svc); setDate(null); setTime(null); setBookingError(null)
    if (svc.bookingMode === 'request') {
      setStep('request-form')
    } else {
      setStep(1)
    }
  }
  function selectDate(d)      { setDate(d); setTime(null); setStep(2) }
  function selectTime(t)      { setTime(t); setStep(3) }
'''

          new_flow = '''  async function findNextAvailableDate(svc, seq) {
    setFindingNext(true)
    setNextSearchError(null)
    setAutoSuggested(false)

    const today = new Date()
    today.setHours(0, 0, 0, 0)
    const horizonDays = configData?.horizonDays ?? 42
    const availableWeekdays = configData?.availableWeekdays
    const candidates = []

    for (let offset = 1; offset <= horizonDays; offset++) {
      const candidate = new Date(today)
      candidate.setDate(candidate.getDate() + offset)
      const jsDay = candidate.getDay()
      const weeklyOpen = availableWeekdays === null
        ? jsDay !== 0 && jsDay !== 6
        : availableWeekdays.includes(jsDay)
      if (weeklyOpen) candidates.push(candidate)
    }

    try {
      const batchSize = 5
      for (let i = 0; i < candidates.length; i += batchSize) {
        const batch = candidates.slice(i, i + batchSize)
        const checked = await Promise.all(batch.map(async candidate => {
          const dateStr = [
            candidate.getFullYear(),
            String(candidate.getMonth() + 1).padStart(2, '0'),
            String(candidate.getDate()).padStart(2, '0'),
          ].join('-')
          const params = new URLSearchParams({
            practitioner: slug,
            date: dateStr,
            service_slug: svc.slug,
          })
          const response = await fetch(`/api/rdv-availability?${params}`)
          if (!response.ok) throw new Error('availability_http_error')
          const data = await response.json()
          return { candidate, data }
        }))

        if (seq !== nextSearchSeq.current) return

        const blockingError = checked.find(({ data }) =>
          data?.mode === 'error' || data?.mode === 'configuration_required'
        )
        if (blockingError) {
          throw new Error(blockingError.data?.notice || 'availability_configuration_error')
        }

        const found = checked.find(({ data }) =>
          Array.isArray(data?.slots) && data.slots.some(slot => slot.available)
        )

        if (found) {
          setDate(found.candidate)
          setTime(null)
          setAutoSuggested(true)
          setStep(2)
          return
        }
      }

      if (seq === nextSearchSeq.current) {
        setNextSearchError("Aucun créneau disponible dans la période de réservation actuelle.")
        setStep(1)
      }
    } catch {
      if (seq === nextSearchSeq.current) {
        setNextSearchError('Impossible de rechercher la prochaine disponibilité pour le moment. Vous pouvez choisir une date manuellement.')
        setStep(1)
      }
    } finally {
      if (seq === nextSearchSeq.current) setFindingNext(false)
    }
  }

  function selectService(svc) {
    const seq = ++nextSearchSeq.current
    setService(svc); setDate(null); setTime(null); setBookingError(null)
    setNextSearchError(null); setAutoSuggested(false)
    if (svc.bookingMode === 'request') {
      setFindingNext(false)
      setStep('request-form')
    } else {
      setStep(1)
      void findNextAvailableDate(svc, seq)
    }
  }
  function selectDate(d)      { ++nextSearchSeq.current; setFindingNext(false); setAutoSuggested(false); setDate(d); setTime(null); setStep(2) }
  function selectTime(t)      { setTime(t); setStep(3) }
'''
          replace_once('src/components/rdv/RdvPublic.jsx', old_flow, new_flow)

          old_step1 = '''            {step === 1 && (
              <div>
                <div className="flex items-center gap-3 mb-5">
                  <button onClick={() => setStep(0)} className="font-georgia text-xs text-mist hover:text-deep">← Prestation</button>
                  <h2 className="font-georgia font-medium text-xl">Choisissez une date</h2>
                </div>
                <CalendarPicker selected={date} onSelect={selectDate} config={configData} />
              </div>
            )}
'''

          new_step1 = '''            {step === 1 && (
              <div>
                <div className="flex items-center gap-3 mb-5">
                  <button onClick={() => { ++nextSearchSeq.current; setFindingNext(false); setStep(0) }} className="font-georgia text-xs text-mist hover:text-deep">← Prestation</button>
                  <h2 className="font-georgia font-medium text-xl">Choisissez une date</h2>
                </div>
                {findingNext ? (
                  <div className="rounded-2xl border border-gold/25 bg-white/60 px-5 py-10 text-center">
                    <div className="w-6 h-6 border-2 border-gold/30 border-t-gold rounded-full animate-spin mx-auto mb-3" />
                    <p className="font-georgia text-sm text-deep">Recherche de la prochaine disponibilité…</p>
                    <p className="font-georgia text-xs text-mist/60 mt-1">Vérification de l'agenda en temps réel.</p>
                  </div>
                ) : (
                  <>
                    {nextSearchError && (
                      <div className="rounded-xl border border-gold/20 bg-gold/5 px-4 py-3 mb-4">
                        <p className="font-georgia text-xs text-mist">{nextSearchError}</p>
                      </div>
                    )}
                    <CalendarPicker selected={date} onSelect={selectDate} config={configData} />
                  </>
                )}
              </div>
            )}
'''
          replace_once('src/components/rdv/RdvPublic.jsx', old_step1, new_step1)

          old_step2 = '''            {step === 2 && (
              <div>
                <div className="flex items-center gap-3 mb-5">
                  <button onClick={() => setStep(1)} className="font-georgia text-xs text-mist hover:text-deep">← Date</button>
                  <h2 className="font-georgia font-medium text-xl capitalize">{fmt(date)}</h2>
                </div>
                <TimeSlots practitionerSlug={slug} date={date} service={service} selected={time} onSelect={selectTime} />
                {time && (
                  <button onClick={() => setStep(3)} className="mt-6 w-full font-georgia py-4 rounded-xl bg-gold text-deep font-bold hover:bg-gold/90 transition-colors">
                    Continuer — {time} →
                  </button>
                )}
              </div>
            )}
'''

          new_step2 = '''            {step === 2 && (
              <div>
                <div className="flex items-center justify-between gap-3 mb-5">
                  <div className="flex items-center gap-3">
                    <button onClick={() => { setAutoSuggested(false); setStep(1) }} className="font-georgia text-xs text-mist hover:text-deep">← Date</button>
                    <h2 className="font-georgia font-medium text-xl capitalize">{fmt(date)}</h2>
                  </div>
                  <button onClick={() => { setAutoSuggested(false); setStep(1) }} className="font-georgia text-xs text-gold hover:text-deep transition-colors">Voir d'autres dates</button>
                </div>
                {autoSuggested && (
                  <div className="rounded-xl border border-gold/25 bg-gold/5 px-4 py-3 mb-4">
                    <p className="font-georgia text-xs text-mist"><strong className="text-deep">Prochaine disponibilité trouvée</strong> — choisissez l'horaire qui vous convient.</p>
                  </div>
                )}
                <TimeSlots practitionerSlug={slug} date={date} service={service} selected={time} onSelect={selectTime} />
                {time && (
                  <button onClick={() => setStep(3)} className="mt-6 w-full font-georgia py-4 rounded-xl bg-gold text-deep font-bold hover:bg-gold/90 transition-colors">
                    Continuer — {time} →
                  </button>
                )}
              </div>
            )}
'''
          replace_once('src/components/rdv/RdvPublic.jsx', old_step2, new_step2)
          PY

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/mediumia-smart-next.yml
          git config user.name "MediumIA Automation"
          git config user.email "actions@users.noreply.github.com"
          git add api/rdv-availability.js src/components/rdv/RdvPublic.jsx .github/workflows/mediumia-smart-next.yml
          git commit -m "feat(rdv): ouvrir directement la prochaine disponibilité réelle"
          git push origin HEAD:agent/mediumia-platform-public
